
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "auth-core"
version = "1.4.0"
description = "Reusable authentication core built with FastAPI, SQLModel and Clean Architecture"
requires-python = ">=3.11"

dependencies = [
    "aiosmtplib>=5.1.1",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "cloudinary>=1.44.2",
    "cryptography>=47.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "fastapi-mail>=1.6.4",
    "itsdangerous>=2.2.0",
    "psycopg2-binary>=2.9.12",
    "pwdlib>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.28",
    "slowapi>=0.1.10",
    "SQLAlchemy>=2.0.49",
    "sqlmodel>=0.0.38",
]


[project.optional-dependencies]
dev = [
    "coverage>=7.15.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "uvicorn>=0.46.0",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["auth_core*"]

[tool.setuptools.package-data]
auth_core = ["auth/infrastructure/templates/*.html"]
